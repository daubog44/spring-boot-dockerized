# Niente container_name: Docker Compose chiama i container
# <cartella>-<servizio>-1, cosi' due copie del progetto sulla stessa macchina
# (quella di prova e quella dell'esame) non si contendono lo stesso nome.
# Per riferirti a un container usa il nome del servizio:
#   docker compose logs eureka-server
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: event_suggestions
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d event_suggestions"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # postgres:18+ tiene i dati in /var/lib/postgresql/<versione>/docker: montando
      # il percorso legacy /var/lib/postgresql/data il volume restava vuoto e il
      # container si rifiutava di partire.
      - postgres-data:/var/lib/postgresql

  eureka-server:
    build:
      context: .
      args:
        MODULE: naming-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  tourist-service:
    build:
      context: .
      args:
        MODULE: tourist-service
    environment:
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      TOURIST_API_BASE_URL: https://tourism.opendatahub.com
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy

  random-service:
    build:
      context: .
      args:
        MODULE: random-service
    environment:
      SERVER_PORT: 8082
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy

  store-service:
    build:
      context: .
      args:
        MODULE: store-service
    environment:
      SERVER_PORT: 8083
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      STORE_DB_URL: jdbc:postgresql://postgres:5432/event_suggestions
      STORE_DB_USERNAME: exam
      STORE_DB_PASSWORD: exam
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ui-service:
    build:
      context: .
      args:
        MODULE: event-ui
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      tourist-service:
        condition: service_started
      random-service:
        condition: service_started
      store-service:
        condition: service_started

volumes:
  postgres-data:
