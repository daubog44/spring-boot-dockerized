services:
  postgres:
    image: postgres:18.3-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_DB: event_suggestions
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d event_suggestions"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  eureka-server:
    container_name: exam-eureka
    build:
      context: .
      args:
        MODULE: naming-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    container_name: exam-product-service
    build:
      context: .
      args:
        MODULE: product-service
    environment:
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy

  crm-service:
    container_name: exam-crm-service
    build:
      context: .
      args:
        MODULE: crm-service
    environment:
      SERVER_PORT: 8082
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy

  wms-service:
    container_name: exam-wms-service
    build:
      context: .
      args:
        MODULE: wms-service
    environment:
      SERVER_PORT: 8083
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      eureka-server:
        condition: service_healthy

  wms-ui:
    container_name: exam-wms-ui
    build:
      context: .
      args:
        MODULE: wms-ui
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      product-service:
        condition: service_started
      crm-service:
        condition: service_started
      wms-service:
        condition: service_started

volumes:
  postgres-data:
