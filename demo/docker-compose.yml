# Niente container_name: Docker Compose chiama i container
# <cartella>-<servizio>-1, cosi' due copie del progetto sulla stessa macchina
# (quella di prova e quella dell'esame) non si contendono lo stesso nome.
# Per riferirti a un container usa il nome del servizio:
#   docker compose logs eureka-server
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: bib
      POSTGRES_PASSWORD: bib2026
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bib -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # postgres:18+ tiene i dati in /var/lib/postgresql/<versione>/docker: montando
      # il percorso legacy /var/lib/postgresql/data il volume restava vuoto e il
      # container si rifiutava di partire.
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql

  eureka-server:
    build:
      context: .
      args:
        MODULE: naming-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  catalogo-service:
    build:
      context: .
      args:
        MODULE: catalogo-service
    environment:
      CATALOGO_DB_URL: jdbc:postgresql://postgres:5432/biblioteca
      CATALOGO_DB_USERNAME: bib
      CATALOGO_DB_PASSWORD: bib2026
      CATALOGO_DB_DRIVER: org.postgresql.Driver
      SERVER_PORT: 8081
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  prestiti-service:
    build:
      context: .
      args:
        MODULE: prestiti-service
    environment:
      PRESTITI_DB_URL: jdbc:postgresql://postgres:5432/prestiti
      PRESTITI_DB_USERNAME: bib
      PRESTITI_DB_PASSWORD: bib2026
      PRESTITI_DB_DRIVER: org.postgresql.Driver
      SERVER_PORT: 8082
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  biblioteca-ui:
    build:
      context: .
      args:
        MODULE: biblioteca-ui
    environment:
      SERVER_PORT: 8090
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8090:8090"
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  postgres-data:
