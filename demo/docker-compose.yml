services:
  postgres:
    image: postgres:18.3-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_DB: esame
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d esame"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # postgres:18+ tiene i dati in /var/lib/postgresql/<versione>/docker: montando
      # il percorso legacy /var/lib/postgresql/data il volume restava vuoto e il
      # container si rifiutava di partire.
      - postgres-data:/var/lib/postgresql

  eureka-server:
    container_name: exam-eureka
    build:
      context: .
      args:
        MODULE: naming-server
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
