spring:
  application:
    name: tourist-service
  # Il load balancer di Feign tiene l'elenco delle istanze in cache per 35
  # secondi: con 5, un servizio appena acceso diventa chiamabile subito.
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    jersey:
      enabled: false
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    # Il registro si rilegge ogni 5 secondi invece che ogni 30.
    registry-fetch-interval-seconds: 5
    webclient:
      enabled: false
  instance:
    prefer-ip-address: true
    # Un battito ogni 5 secondi: se il servizio si spegne, dopo 15 Eureka lo
    # toglie e gli altri smettono di chiamarlo.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
tourist:
  api:
    base-url: ${TOURIST_API_BASE_URL:https://tourism.opendatahub.com}
    default-language: ${TOURIST_DEFAULT_LANGUAGE:it}
    default-limit: ${TOURIST_DEFAULT_LIMIT:10}
    default-radius: ${TOURIST_DEFAULT_RADIUS:10000}
