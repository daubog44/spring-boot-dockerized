server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Solo cookie: senza questo, al primo invio di un form (quando il client non ha
      # ancora un JSESSIONID) Tomcat riscrive il redirect in "/;jsessionid=..." e la
      # richiesta successiva risponde 404, perche' i path parameter sono rifiutati.
      tracking-modes: cookie

spring:
  application:
    name: WMS-UI

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
