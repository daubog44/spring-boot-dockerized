server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Solo cookie: senza questo, al primo invio di un form (quando il client non ha
      # ancora un JSESSIONID) Tomcat riscrive il redirect in "/;jsessionid=..." e la
      # richiesta successiva risponde 404, perche' i path parameter sono rifiutati.
      tracking-modes: cookie

spring:
  application:
    name: WMS-UI
  # Il load balancer di Feign tiene l'elenco delle istanze in cache per 35
  # secondi: con 5, un servizio appena acceso diventa chiamabile subito.
  cloud:
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    # Il registro si rilegge ogni 5 secondi invece che ogni 30.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Un battito ogni 5 secondi: se il servizio si spegne, dopo 15 Eureka lo
    # toglie e gli altri smettono di chiamarlo.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
