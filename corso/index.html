<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalla traccia alla consegna</title>
<meta name="description" content="Il corso d'esame dalla A alla Z: il template, il codice di ogni pezzo, la consegna. Si apre col doppio clic, senza rete.">
<link rel="stylesheet" href="corso.css">
</head>
<body>
<!--
  Il corso d'esame. Il testo non sta qui: le lezioni sono in corso/lezioni/,
  le guide nella cartella principale. `task learn` le raccoglie in
  contenuti.js e apre questa pagina. Si apre anche col doppio clic.
-->
<div class="app">
  <header class="barra">
    <button class="menu" id="menu" type="button" aria-label="Apri l'indice">&#9776; Indice</button>
    <a class="marchio" href="#"><span>Dalla traccia alla consegna</span></a>
    <div class="cerca" role="search">
      <input id="cerca" type="search" placeholder="Cerca in lezioni e guide (tasto /)" autocomplete="off" aria-label="Cerca in lezioni e guide">
      <div class="risultati" id="risultati" hidden></div>
    </div>
    <button class="tema" id="tema" type="button">Tema: sistema</button>
  </header>
  <nav class="indice" id="indice" aria-label="Indice del corso"></nav>
  <main id="pagina"></main>
  <aside class="sommario" id="sommario" aria-label="In questa pagina"></aside>
</div>
<script src="contenuti.js"></script>
<script src="corso.js"></script>
</body>
</html>
