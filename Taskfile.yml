version: "3"

vars:
  JAVA_HOME_PATH: '{{.JAVA_HOME | default "C:/Program Files/Microsoft/jdk-25.0.2.10-hotspot"}}'

tasks:
  run-eureka:
    desc: Run the Eureka server locally
    cmds:
      - task: run-module
        vars:
          MODULE: "naming-server"

  run-product:
    desc: Run the Product catalog service locally
    cmds:
      - task: run-module
        vars:
          MODULE: "product-service"

  run-crm:
    desc: Run the CRM mock service locally
    cmds:
      - task: run-module
        vars:
          MODULE: "crm-service"

  run-wms:
    desc: Run the WMS backend service locally
    cmds:
      - task: run-module
        vars:
          MODULE: "wms-service"

  run-wms-ui:
    desc: Run the WMS Web UI locally
    cmds:
      - task: run-module
        vars:
          MODULE: "wms-ui"

  run-db:
    desc: Start only PostgreSQL via Docker
    dir: demo
    cmds:
      - docker compose up -d postgres

  docker-up:
    desc: Build and start the full WMS exam stack
    dir: demo
    cmds:
      - docker compose build
      - docker compose up -d

  docker-down:
    desc: Stop the full exam stack
    dir: demo
    cmds:
      - docker compose down -v --remove-orphans

  docker-logs:
    desc: Tail compose logs
    dir: demo
    cmds:
      - docker compose logs -f

  build:
    desc: Package all Maven modules
    dir: demo
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& mvnw.cmd clean package -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ./mvnw clean package -Dmaven.test.skip=true{{end}}'

  clean-ports:
    desc: Kill Java processes
    cmds:
      - '{{if eq OS "windows"}}cmd /c "taskkill /F /IM java.exe /T 2>nul || ver >nul"{{else}}pkill -f java || true{{end}}'

  test-e2e:
    desc: Run automated E2E test script
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./test_e2e_wms.ps1

  run-module:
    internal: true
    dir: 'demo/{{.MODULE}}'
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd -f ..\\pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw -f ../pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true{{end}}'
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd spring-boot:run"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw spring-boot:run{{end}}'
