version: "3"

vars:
  # Il JDK per Maven: quello di JAVA_HOME se la cartella esiste davvero, se no
  # quello dove lo installa di solito il template su Windows; se non c'e'
  # nemmeno quello resta vuoto, e il wrapper Maven usa il java del PATH.
  # Cosi' il template gira anche su un PC dove il JDK sta altrove, invece di
  # fermarsi con "JAVA_HOME environment variable is not defined correctly".
  JAVA_HOME_PATH:
    sh: 'for d in "$JAVA_HOME" "C:/Program Files/Microsoft/jdk-25.0.2.10-hotspot"; do if [ -n "$d" ] && [ -d "$d" ]; then echo "$d"; break; fi; done'

# Ogni comando si usa con variabili NOME=valore, mai con trattini:
#   task new-service NAME=ordini-service
#   task add-dep SERVICE=wms-service DEPS=security,mail
#   task logs SERVICE=wms
# `task help` stampa tutto, `task --summary <comando>` il dettaglio di uno.

tasks:
  default:
    desc: Stampa la guida ai comandi (come task help)
    silent: true
    cmds:
      - task: help

  help:
    desc: Guida ai comandi, con le variabili di ognuno e gli esempi
    silent: true
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/help.ps1{{else}}bash ./scripts/help.sh{{end}}'

  # --- Inizio e fine del progetto ---------------------------------------------
  # Il wizard monta il progetto facendo domande; la consegna prepara la
  # cartella da consegnare. In mezzo c'e' tutto il resto.

  wizard:
    desc: "WIZARD: fa le domande e monta il progetto (task wizard, oppure SERVICE=<modulo> per uno solo)"
    aliases: [init]
    interactive: true
    summary: |
      Chiede quello che serve e lancia i comandi giusti nell'ordine giusto:
      come si chiama la cartella dei moduli, se il progetto usa PostgreSQL e
      con quali credenziali e porta, e poi i microservizi uno per uno (REST, REST
      senza database, o interfaccia Thymeleaf; porta; H2 o PostgreSQL).
      Alla fine lancia `task check`.

      Eureka, OpenFeign, Swagger, Lombok, validation, actuator e common-dto
      ci sono gia' nel modulo appena nasce: non te li chiede perche' non c'e'
      niente da decidere.

      Variabili (facoltative):
        SERVICE=<modulo>   solo le domande di quel microservizio (lo crea se
                           non esiste, lo rifinisce se c'e' gia')

      Esempi:
        task wizard
        task wizard SERVICE=tourist-service

      Serve un terminale vero: fa domande.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/wizard.ps1{{if .SERVICE}} -Service {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/wizard.sh{{if .SERVICE}} --service {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{end}}'

  consegna:
    desc: "Prepara la cartella da consegnare: progetto pronto da eseguire, allegato tecnico, istruzioni (task consegna NOME=ROSSI_MARIO)"
    summary: |
      Mette in consegna/ tutto quello che va consegnato e niente di quello che
      non serve:

        <modulo>/                  i sorgenti di ogni microservizio, senza
                                   target/ (megabyte di roba ricompilabile)
        docker-compose.yml         + Dockerfile, pom, wrapper Maven e script
                                   di init, accanto ai moduli
        ALLEGATO-TECNICO.md        gia' compilato con moduli, porte, endpoint
                                   e schema del database
        SCHEMA-DATABASE.md         lo schema da solo, comodo da copiare
        ISTRUZIONI-ESECUZIONE.md   come far girare il progetto
        <NOME>.zip                 tutto quanto sopra in un archivio solo

      Chi corregge scompatta <NOME>.zip e lancia `docker compose up --build`:
      dentro non ci sono altri archivi da aprire.

      Variabili:
        NOME=<COGNOME_NOME>   nome dell'archivio finale
        OUT=<cartella>        dove prepararla (default: consegna/)

      Esempio:
        task consegna NOME=ROSSI_MARIO

      Prima di consegnare passa da `task check`: se il progetto non e'
      coerente, si ferma.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/consegna.ps1{{if .NOME}} -Nome {{.NOME}}{{end}}{{if .OUT}} -OutDir {{.OUT}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/consegna.sh{{if .NOME}} --nome {{.NOME}}{{end}}{{if .OUT}} --out-dir {{.OUT}}{{end}} {{.CLI_ARGS}}{{end}}'

  # --- Sviluppo quotidiano ----------------------------------------------------

  dev:
    desc: "AVVIO SVILUPPO: pulisce, compila e avvia tutto lo stack in background con hot reload"
    summary: |
      Libera le porte, compila tutti i moduli e avvia lo stack in background,
      con hot reload. Restituisce il prompt: i log si seguono con `task logs`.

      Variabili (tutte facoltative):
        UI_PORT=<porta>   sposta la UI solo per questo avvio
        NOBUILD=1         salta la compilazione iniziale
        KEEPFOREIGN=1     non chiudere le applicazioni estranee sulle porte

      Esempi:
        task dev
        task dev UI_PORT=9080
        task dev NOBUILD=1
    env:
      # Lo stesso JDK usato da `task build`: se il percorso non esiste lo script
      # lo ignora e usa il java del PATH.
      JAVA_HOME: '{{.JAVA_HOME_PATH}}'
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev.ps1{{if .UI_PORT}} -UiPort {{.UI_PORT}}{{end}}{{if .NOBUILD}} -NoBuild{{end}}{{if .KEEPFOREIGN}} -KeepForeign{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/dev.sh{{if .UI_PORT}} --ui-port {{.UI_PORT}}{{end}}{{if .NOBUILD}} --no-build{{end}}{{if .KEEPFOREIGN}} --keep-foreign{{end}} {{.CLI_ARGS}}{{end}}'

  dev-down:
    desc: "STOP SVILUPPO: ferma i servizi locali e libera le porte"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev-down.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/dev-down.sh {{.CLI_ARGS}}{{end}}'

  logs:
    desc: "Segue i log dei servizi in un terminale solo (task logs SERVICE=<nome> per uno)"
    summary: |
      Segue in tempo reale i log dei servizi avviati da `task dev`, tutti in un
      terminale solo, ogni riga prefissata dal nome del servizio.
      Ctrl+C chiude solo questa vista: i servizi restano accesi.

      Variabili (tutte facoltative):
        SERVICE=<nome>    un servizio solo (il nome breve, come in task status)
        TAIL=<righe>      quante righe di storico mostrare (default 30)

      Esempi:
        task logs
        task logs SERVICE=<nome>
        task logs SERVICE=<nome> TAIL=200
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/logs.ps1{{if .SERVICE}} {{.SERVICE}}{{end}}{{if .TAIL}} -Tail {{.TAIL}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/logs.sh{{if .SERVICE}} {{.SERVICE}}{{end}}{{if .TAIL}} --tail {{.TAIL}}{{end}} {{.CLI_ARGS}}{{end}}'

  status:
    desc: "Chi occupa le porte, quali container girano, cosa e' registrato su Eureka"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/status.ps1{{else}}bash ./scripts/status.sh{{end}}'

  compile:
    desc: Ricompila i moduli e fa ripartire i servizi gia' avviati (hot reload)
    dir: demo
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& .\mvnw.cmd -q install -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ./mvnw -q install -Dmaven.test.skip=true{{end}}'

  # --- Modifiche strutturali --------------------------------------------------
  # Aggiungere un modulo o una dipendenza, o spostare una porta, tocca piu' file
  # che devono restare d'accordo fra loro. Questi tre comandi li tengono
  # allineati: vedi GIORNO-ESAME.md, sezione "Modifiche strutturali".

  new-service:
    desc: "Crea un microservizio nuovo e lo collega a tutto (task new-service NAME=ordini-service)"
    summary: |
      Crea un modulo nuovo e lo collega dove serve: <modules> del pom
      aggregatore, COPY nel Dockerfile, blocco in docker-compose.yml e lista
      dei servizi di `task dev`. Genera pom, Main, application.yml e un
      endpoint /api/ping (o una pagina, con UI=1).

      Variabili:
        NAME=<nome-modulo>   OBBLIGATORIA, minuscole e trattini
        PORT=<porta>         facoltativa: di default la prima libera
        UI=1                 modulo Thymeleaf invece di un servizio REST
        NODB=1               servizio senza JPA, H2 e PostgreSQL

      Esempi:
        task new-service NAME=ordini-service
        task new-service NAME=report-ui UI=1
        task new-service NAME=calcolo-service NODB=1 PORT=8090

      Dopo serve `task dev` (non `task compile`): il modulo nuovo non e'
      ancora in esecuzione.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/new-service.ps1{{if .NAME}} -Name {{.NAME}}{{end}}{{if .PORT}} -Port {{.PORT}}{{end}}{{if .UI}} -Ui{{end}}{{if .NODB}} -NoDb{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/new-service.sh{{if .NAME}} --name {{.NAME}}{{end}}{{if .PORT}} --port {{.PORT}}{{end}}{{if .UI}} --ui{{end}}{{if .NODB}} --no-db{{end}} {{.CLI_ARGS}}{{end}}'

  add-dep:
    desc: "Aggiunge dipendenze al pom di un modulo (task add-dep SERVICE=<modulo> DEPS=security,mail)"
    summary: |
      Inserisce dipendenze nel pom.xml di un modulo. Le versioni non si
      scrivono: le decide il pom padre (Spring Boot e il BOM di Spring Cloud).

      Variabili:
        SERVICE=<modulo>     OBBLIGATORIA, la cartella sotto demo/
        DEPS=<a,b,c>         OBBLIGATORIA, nomi brevi separati da virgole,
                             oppure coordinate gruppo:artefatto[:versione]
        LIST=1               stampa i 35 nomi brevi conosciuti ed esce

      Esempi:
        task add-dep LIST=1
        task add-dep SERVICE=ordini-service DEPS=security,mail
        task add-dep SERVICE=ordini-service DEPS=org.apache.commons:commons-lang3:3.17.0

      Dopo serve `task dev` (non `task compile`): il classpath di un servizio
      e' fissato quando parte.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/add-dep.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}}{{if .DEPS}} -Deps {{.DEPS}}{{end}}{{if .LIST}} -List{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/add-dep.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}}{{if .DEPS}} --deps {{.DEPS}}{{end}}{{if .LIST}} --list{{end}} {{.CLI_ARGS}}{{end}}'

  set-port:
    desc: "Sposta un modulo su un'altra porta, ovunque sia scritta (task set-port SERVICE=<modulo> PORT=9080)"
    summary: |
      Cambia la porta di un modulo in tutti e quattro i posti in cui e'
      scritta: application.yml, docker-compose.yml (variabile d'ambiente e
      pubblicazione) e lista dei servizi di dev.ps1 e dev.sh. Se sposti
      naming-server aggiorna anche il defaultZone di Eureka di tutti.

      Variabili:
        SERVICE=<modulo>   OBBLIGATORIA, la cartella sotto demo/
        PORT=<porta>       OBBLIGATORIA

      Esempi:
        task set-port SERVICE=ordini-service PORT=8090
        task set-port SERVICE=naming-server PORT=8762

      Per una prova al volo, senza toccare i file: task dev UI_PORT=9080
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/set-port.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}}{{if .PORT}} -Port {{.PORT}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/set-port.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}}{{if .PORT}} --port {{.PORT}}{{end}} {{.CLI_ARGS}}{{end}}'

  remove-service:
    desc: "Toglie un modulo dal progetto e da tutti i file che lo nominano (task remove-service SERVICE=<modulo>)"
    summary: |
      L'inverso di new-service: cancella la cartella del modulo e lo toglie dai
      <modules>, dal Dockerfile, dal docker-compose e dalle liste dei servizi.
      Avvisa se qualche altro modulo lo chiamava.

      Variabili:
        SERVICE=<modulo>   OBBLIGATORIA, la cartella sotto demo/

      Esempio:
        task remove-service SERVICE=ordini-service
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/remove-service.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/remove-service.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{end}}'

  use-postgres:
    desc: "Collega un modulo al PostgreSQL del progetto, al posto dell'H2 (task use-postgres SERVICE=<modulo>)"
    summary: |
      Sposta un modulo da H2 in memoria al PostgreSQL che sta gia' nel
      docker-compose: dipendenze nel pom, url/utente/password
      nell'application.yml, le stesse variabili nel compose (dove il database
      si chiama "postgres", non "localhost"), depends_on sul database, e
      `task dev` che d'ora in poi lo avvia.

      Variabili:
        SERVICE=<modulo>   OBBLIGATORIA, la cartella sotto demo/
        DBNAME=<database>  facoltativa: un database dedicato a questo modulo,
                           invece di quello condiviso del compose

      Esempi:
        task use-postgres SERVICE=ordini-service
        task use-postgres SERVICE=ordini-service DBNAME=ordini

      Con DBNAME crea anche lo script di init del database: PostgreSQL li
      esegue solo a volume vuoto, quindi la prima volta serve
      `task docker-reset`.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/use-postgres.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}}{{if .DBNAME}} -DbName {{.DBNAME}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/use-postgres.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}}{{if .DBNAME}} --db-name {{.DBNAME}}{{end}} {{.CLI_ARGS}}{{end}}'

  enable-swagger:
    desc: "Accende Swagger UI su un modulo che non ce l'ha (task enable-swagger SERVICE=<modulo>)"
    summary: |
      I moduli creati con `task new-service` hanno gia' Swagger: dipendenza nel
      pom e blocco nell'application.yml, quindi /swagger-ui.html risponde dal
      primo avvio. Questo comando serve per un modulo scritto a mano o da cui
      la dipendenza e' stata tolta, ed e' idempotente.

      Variabili:
        SERVICE=<modulo>   OBBLIGATORIA, la cartella sotto demo/

      Esempio:
        task enable-swagger SERVICE=ordini-service
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/enable-swagger.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/enable-swagger.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}} {{.CLI_ARGS}}{{end}}'

  rename-project:
    desc: "Rinomina la cartella dei moduli Maven, ovunque sia nominata (task rename-project NAME=wms)"
    summary: |
      La cartella che contiene il pom aggregatore, il Dockerfile e il
      docker-compose si chiama demo perche' cosi' nasce da Spring Initializr.
      Questo comando le da' il nome del progetto, e aggiorna insieme a lei il
      Taskfile, gli script e le guide che la nominano. Alla fine lancia
      `task check`.

      Variabili:
        NAME=<nome>   OBBLIGATORIA, minuscole, numeri e trattini

      Esempio:
        task rename-project NAME=wms

      La cartella che contiene tutto (quella del repository) rinominala pure a
      mano: nessuno script dipende dal suo nome.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/rename-project.ps1{{if .NAME}} -Name {{.NAME}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/rename-project.sh{{if .NAME}} --name {{.NAME}}{{end}} {{.CLI_ARGS}}{{end}}'

  db-config:
    desc: "Cambia nome, utente, password o porta del database, e aggiorna i moduli collegati (task db-config)"
    summary: |
      Senza variabili stampa com'e' configurato adesso il database e quali
      moduli ci sono collegati: e' il modo piu' veloce per ricordarsi la
      password durante la demo.

      Con le variabili cambia i valori dappertutto in una volta: nel container
      postgres del compose (compresa la sua healthcheck e la porta
      pubblicata), nelle variabili d'ambiente di ogni modulo collegato,
      nell'application.yml di ognuno e negli script di init dei database
      dedicati.

      Variabili (tutte facoltative):
        DBNAME=<nome>       nome del database condiviso
        USER=<utente>       utente
        PASSWORD=<password> password
        PORT=<porta>        porta pubblicata sulla macchina (in Docker resta 5432)

      Esempi:
        task db-config
        task db-config DBNAME=magazzino USER=wms PASSWORD=wms123
        task db-config PORT=5433

      PostgreSQL crea utente e database solo al primo avvio, su volume vuoto:
      dopo aver cambiato nome, utente o password serve `task docker-reset`.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/db-config.ps1{{if .DBNAME}} -DbName {{.DBNAME}}{{end}}{{if .USER}} -User {{.USER}}{{end}}{{if .PASSWORD}} -Password {{.PASSWORD}}{{end}}{{if .PORT}} -Port {{.PORT}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/db-config.sh{{if .DBNAME}} --db-name {{.DBNAME}}{{end}}{{if .USER}} --user {{.USER}}{{end}}{{if .PASSWORD}} --password {{.PASSWORD}}{{end}}{{if .PORT}} --port {{.PORT}}{{end}} {{.CLI_ARGS}}{{end}}'

  db-schema:
    desc: "Ricava lo schema concettuale e logico del database dalle @Entity (task db-schema)"
    summary: |
      Legge le classi annotate con @Entity e ne ricava le tabelle: colonne,
      tipi SQL, chiavi primarie ed esterne, relazioni, piu' un diagramma ER in
      mermaid che GitHub e VS Code disegnano da soli. E' lo "schema
      concettuale e logico della base dati" che chiede l'allegato tecnico,
      ricavato dal codice invece che ricordato a memoria.

      Non si collega a nessun database: legge i sorgenti. Funziona anche a
      stack spento, e dice la verita' su quello che Hibernate creera'.

      Variabili (facoltative):
        OUT=<file>   scrive su file invece che a schermo

      Esempi:
        task db-schema
        task db-schema OUT=schema.md

      Lo genera da solo anche `task consegna`.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/db-schema.ps1{{if .OUT}} -OutFile {{.OUT}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/db-schema.sh{{if .OUT}} --out {{.OUT}}{{end}} {{.CLI_ARGS}}{{end}}'

  seed-data:
    desc: "Riempie il database di dati di prova ricavati dalle @Entity (task seed-data)"
    summary: |
      Legge le @Entity e scrive un src/main/resources/data.sql per modulo, con
      le INSERT. Spring Boot lo esegue all'avvio, dopo che Hibernate ha creato
      le tabelle.

      I valori sono inventati ma plausibili: le stringhe seguono il nome della
      colonna (un campo "citta" prende nomi di citta', un "email" indirizzi),
      gli enum vengono presi davvero dai valori dichiarati nel file Java, e le
      tabelle con chiave esterna vengono riempite dopo quelle a cui puntano.

      Aggiunge da solo all'application.yml le due proprieta' senza cui il file
      non verrebbe eseguito (defer-datasource-initialization e sql.init.mode).

      Variabili (tutte facoltative):
        SERVICE=<modulo>   un modulo solo (default: tutti quelli con @Entity)
        ROWS=<numero>      quante righe per tabella (default 5)

      Esempi:
        task seed-data
        task seed-data SERVICE=tourist-service ROWS=10

      Ogni INSERT scatta solo se la tabella non e' ancora piena: un riavvio
      (o un hot reload) su PostgreSQL non duplica niente. Per ripartire dai
      soli dati di prova: `task docker-reset`.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/seed-data.ps1{{if .SERVICE}} -Module {{.SERVICE}}{{end}}{{if .ROWS}} -Rows {{.ROWS}}{{end}} {{.CLI_ARGS}}{{else}}bash ./scripts/seed-data.sh{{if .SERVICE}} --module {{.SERVICE}}{{end}}{{if .ROWS}} --rows {{.ROWS}}{{end}} {{.CLI_ARGS}}{{end}}'

  ide-sync:
    desc: "Riallinea VS Code e Zed ai moduli veri del progetto (task ide-sync)"
    summary: |
      Riscrive la configurazione degli editor leggendo i moduli veri:

        .vscode/launch.json   una configurazione di debug per modulo, con la
                              classe Main trovata nei sorgenti, piu' il
                              compound "Stack completo" che li avvia tutti
        .vscode/tasks.json    i comandi task dalla palette di VS Code
        .zed/tasks.json       gli stessi comandi per Zed
        .zed/debug.json       le configurazioni di debug per Zed (F4)

      E, solo se mancano, i file che non dipendono dai moduli e che puoi
      modificare a piacere: .vscode/settings.json, .vscode/extensions.json,
      .zed/settings.json, .editorconfig.

      Lo chiamano da soli new-service, remove-service e set-port: a mano serve
      solo se hai toccato i moduli senza passare da loro. Se il launch.json
      resta indietro te lo dice `task check`.

      In VS Code serve l'Extension Pack for Java; in Zed l'estensione Java.
      IntelliJ non ha bisogno di niente: apri il pom aggregatore.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/ide-sync.ps1{{else}}bash ./scripts/ide-sync.sh{{end}}'

  check:
    desc: "Controlla che il progetto sia coerente: moduli, porte, Docker, lista dei servizi"
    summary: |
      Verifica, senza avviare niente, che le parti che devono restare
      d'accordo lo siano davvero: ogni modulo dichiarato nel pom aggregatore
      esiste, ogni servizio della lista di `task dev` ha il suo modulo e la
      porta che dichiara nel suo application.yml, ogni modulo ha la sua COPY
      nel Dockerfile e il suo blocco in docker-compose.yml.

      Lanciala dopo una modifica fatta a mano, e prima della demo.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/check.ps1{{else}}bash ./scripts/check.sh{{end}}'

  test:
    desc: "Collauda gli strumenti del template (new-service, add-dep, set-port) in una copia usa-e-getta"
    summary: |
      Esegue la suite di prove degli strumenti su una copia temporanea del
      repository: il progetto vero non viene toccato. Verifica che i moduli
      generati siano XML valido e coerenti in tutti i file, che le dipendenze
      non si duplichino, che gli errori d'uso falliscano davvero, e che
      `task check` passi.

      Variabili:
        FULL=1   compila anche con Maven il modulo generato (piu' lento)

      Esempi:
        task test
        task test FULL=1
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/self-test.ps1{{if .FULL}} -Full{{end}}{{else}}bash ./scripts/self-test.sh{{if .FULL}} --full{{end}}{{end}}'

  offline:
    desc: "Dice se il progetto partirebbe senza rete (cache Maven, immagini Docker)"
    summary: |
      Il giorno dell'esame potresti non avere internet. Maven scarica le
      dipendenze in ~/.m2, Docker le immagini di base: se non sono gia' sul
      disco, a rete staccata non parte niente.

      Questo comando controlla gli attrezzi (go-task, JDK), la cache di Maven,
      prova davvero una build offline (mvnw -o) e verifica che le immagini
      Docker siano gia' scaricate. Alla fine dice come presentare senza rete.

      Per scaricare quello che manca, con la rete: `task offline-prep`.
    env:
      JAVA_HOME: '{{.JAVA_HOME_PATH}}'
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/offline.ps1{{else}}bash ./scripts/offline.sh{{end}}'

  offline-prep:
    desc: "DA FARE CON LA RETE: scarica tutto quello che servira' il giorno dell'esame"
    summary: |
      Da lanciare la sera prima, con internet. Scarica le dipendenze Maven in
      ~/.m2, compila una volta, scarica le immagini Docker di base e fa una
      prima `docker compose build`, che riempie la cache dei livelli (compreso
      quello con curl, che a rete staccata non si potrebbe piu' installare).

      Poi verifica con `task offline`.
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/offline.ps1 -Prep{{else}}bash ./scripts/offline.sh --prep{{end}}'

  # --- Stack in container -----------------------------------------------------

  docker-up:
    desc: Compila le immagini e avvia lo stack completo in Docker
    cmds:
      # Meglio fermarsi subito che a build finita: `task check` vede anche le
      # porte che Windows si e' riservato, e su quelle Docker non riesce a
      # pubblicare ("bind: An attempt was made to access a socket in a way
      # forbidden by its access permissions").
      - task: check
      # Lo stack locale userebbe le stesse porte: se e' rimasto acceso, i
      # container non riuscirebbero a pubblicarle.
      - task: dev-down
      - task: compose-up

  docker-down:
    desc: Ferma i container (i dati del database restano)
    dir: demo
    cmds:
      - docker compose down --remove-orphans

  docker-reset:
    desc: Ferma i container ED elimina i volumi (database ricreato da zero)
    dir: demo
    cmds:
      - docker compose down -v --remove-orphans

  docker-logs:
    desc: Segue i log dei container
    dir: demo
    cmds:
      - docker compose logs -f

  run-db:
    desc: Avvia il solo PostgreSQL in Docker
    dir: demo
    cmds:
      - docker compose up -d postgres

  # --- Build e test -----------------------------------------------------------

  build:
    desc: Compila e impacchetta tutti i moduli Maven
    dir: demo
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& .\mvnw.cmd clean package -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ./mvnw clean package -Dmaven.test.skip=true{{end}}'

  # --- Pulizia ----------------------------------------------------------------

  clean-ports:
    desc: Libera le porte dello stack (come dev-down)
    cmds:
      - task: dev-down

  kill-java:
    desc: "ULTIMA SPIAGGIA: termina TUTTI i processi java della macchina, anche estranei al progetto"
    cmds:
      - '{{if eq OS "windows"}}cmd /c "taskkill /F /IM java.exe /T 2>nul || ver >nul"{{else}}pkill -f java || true{{end}}'

  # --- Avvio di un singolo servizio in primo piano ----------------------------

  run-eureka:
    desc: Avvia il solo Eureka server, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "naming-server"

  run:
    desc: "Avvia un solo modulo in primo piano, per vederne l'output (task run SERVICE=<modulo>)"
    summary: |
      Avvia un modulo solo, in primo piano: l'output resta nel terminale e
      Ctrl+C lo ferma. Comodo quando ne stai debuggando uno.
      Per lo stack intero, in background, resta `task dev`.

      Variabili:
        SERVICE=<modulo>   OBBLIGATORIA, la cartella sotto demo/

      Esempio:
        task run SERVICE=ordini-service
    cmds:
      - task: run-module
        vars:
          MODULE: '{{.SERVICE}}'

  # --- Interni ----------------------------------------------------------------

  compose-up:
    internal: true
    dir: demo
    cmds:
      - docker compose build
      - docker compose up -d

  run-module:
    internal: true
    dir: 'demo/{{.MODULE}}'
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd -f ..\\pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw -f ../pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true{{end}}'
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd spring-boot:run"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw spring-boot:run{{end}}'
