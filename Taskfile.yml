version: "3"

vars:
  JAVA_HOME_PATH: '{{.JAVA_HOME | default "C:/Program Files/Microsoft/jdk-25.0.2.10-hotspot"}}'

tasks:
  default:
    desc: Elenca i comandi disponibili
    silent: true
    cmds:
      - task --list

  # --- Sviluppo quotidiano ----------------------------------------------------

  dev:
    desc: "AVVIO SVILUPPO: pulisce, compila e avvia tutto lo stack in background con hot reload"
    env:
      # Lo stesso JDK usato da `task build`: se il percorso non esiste lo script
      # lo ignora e usa il java del PATH.
      JAVA_HOME: '{{.JAVA_HOME_PATH}}'
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/dev.sh {{.CLI_ARGS}}{{end}}'

  dev-down:
    desc: "STOP SVILUPPO: ferma i servizi locali e libera le porte"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev-down.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/dev-down.sh {{.CLI_ARGS}}{{end}}'

  logs:
    desc: "Segue i log di tutti i servizi in un terminale solo (task logs -- store per uno)"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/logs.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/logs.sh {{.CLI_ARGS}}{{end}}'

  status:
    desc: "Chi occupa le porte, quali container girano, cosa e' registrato su Eureka"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/status.ps1{{else}}bash ./scripts/status.sh{{end}}'

  compile:
    desc: Ricompila i moduli e fa ripartire i servizi gia' avviati (hot reload)
    dir: demo
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& .\mvnw.cmd -q install -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ./mvnw -q install -Dmaven.test.skip=true{{end}}'

  # --- Modifiche strutturali --------------------------------------------------
  # Aggiungere un modulo o una dipendenza, o spostare una porta, tocca piu' file
  # che devono restare d'accordo fra loro. Questi tre comandi li tengono
  # allineati: vedi GIORNO-ESAME.md, sezione "Modifiche strutturali".

  new-service:
    desc: "Crea un microservizio nuovo e lo collega a tutto (task new-service -- -Name ordini-service [-Ui] [-Port N])"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/new-service.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/new-service.sh {{.CLI_ARGS}}{{end}}'

  add-dep:
    desc: "Aggiunge dipendenze al pom di un modulo (task add-dep -- -Module tourist-service -Deps security,mail; elenco: -List)"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/add-dep.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/add-dep.sh {{.CLI_ARGS}}{{end}}'

  set-port:
    desc: "Sposta un modulo su un'altra porta, ovunque sia scritta (task set-port -- -Module event-ui -Port 9080)"
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/set-port.ps1 {{.CLI_ARGS}}{{else}}bash ./scripts/set-port.sh {{.CLI_ARGS}}{{end}}'

  # --- Stack in container -----------------------------------------------------

  docker-up:
    desc: Compila le immagini e avvia lo stack completo in Docker
    cmds:
      # Lo stack locale userebbe le stesse porte: se e' rimasto acceso, i
      # container non riuscirebbero a pubblicarle.
      - task: dev-down
      - task: compose-up

  docker-down:
    desc: Ferma i container (i dati del database restano)
    dir: demo
    cmds:
      - docker compose down --remove-orphans

  docker-reset:
    desc: Ferma i container ED elimina i volumi (database ricreato da zero)
    dir: demo
    cmds:
      - docker compose down -v --remove-orphans

  docker-logs:
    desc: Segue i log dei container
    dir: demo
    cmds:
      - docker compose logs -f

  run-db:
    desc: Avvia il solo PostgreSQL in Docker
    dir: demo
    cmds:
      - docker compose up -d postgres

  # --- Build ------------------------------------------------------------------

  build:
    desc: Compila e impacchetta tutti i moduli Maven
    dir: demo
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& .\mvnw.cmd clean package -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ./mvnw clean package -Dmaven.test.skip=true{{end}}'

  # --- Pulizia ----------------------------------------------------------------

  clean-ports:
    desc: Libera le porte dello stack (come dev-down)
    cmds:
      - task: dev-down

  kill-java:
    desc: "ULTIMA SPIAGGIA: termina TUTTI i processi java della macchina, anche estranei al progetto"
    cmds:
      - '{{if eq OS "windows"}}cmd /c "taskkill /F /IM java.exe /T 2>nul || ver >nul"{{else}}pkill -f java || true{{end}}'

  # --- Avvio di un singolo servizio in primo piano ----------------------------

  run-eureka:
    desc: Avvia il solo Eureka server, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "naming-server"

  run-tourist:
    desc: Avvia il solo tourist-service, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "tourist-service"

  run-random:
    desc: Avvia il solo random-service, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "random-service"

  run-store:
    desc: Avvia il solo store-service, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "store-service"

  run-ui:
    desc: Avvia la sola event-ui, in primo piano
    cmds:
      - task: run-module
        vars:
          MODULE: "event-ui"

  # --- Interni ----------------------------------------------------------------

  compose-up:
    internal: true
    dir: demo
    cmds:
      - docker compose build eureka-server
      - docker compose build tourist-service
      - docker compose build random-service
      - docker compose build store-service
      - docker compose build ui-service
      - docker compose up -d

  run-module:
    internal: true
    dir: 'demo/{{.MODULE}}'
    cmds:
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd -f ..\\pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw -f ../pom.xml -pl {{.MODULE}} -am install -Dmaven.test.skip=true{{end}}'
      - '{{if eq OS "windows"}}cmd /c "set JAVA_HOME={{.JAVA_HOME_PATH}}&& ..\\mvnw.cmd spring-boot:run"{{else}}JAVA_HOME="{{.JAVA_HOME_PATH}}" ../mvnw spring-boot:run{{end}}'
